name: Deploy Staging

# Manual only. This must never run on push/PR — staging is updated on request
# (a human, or an agent explicitly told to "update staging"), not on every
# merge to main. See agents/README.md -> "Deploying to Staging" for how
# Claude/Codex are expected to invoke this.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install the trusted staging host key
        # No ssh-keyscan / StrictHostKeyChecking=no here: the known_hosts
        # entry comes from a secret captured and verified ahead of time
        # (see agents/README.md -> "Deploying to Staging"), and the SSH
        # step below pins StrictHostKeyChecking=yes against it.
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync, build, and restart on the staging VPS
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key

          # The remote script is sent over SSH stdin and run fresh on the VPS
          # as its own bash process — it never touches the repo checkout or
          # .env on this runner, and it never reads/writes staging's .env
          # (only greps two already-set port values out of it).
          ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/sparki

          echo "::group::Sync checkout to origin/main"
          git fetch origin
          git checkout main
          git reset --hard origin/main
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "Checked out $DEPLOY_SHA"
          echo "::endgroup::"

          echo "::group::Install dependencies (pnpm, frozen lockfile)"
          pnpm install --frozen-lockfile
          echo "::endgroup::"

          echo "::group::Apply pending database migrations"
          pnpm --filter @sparki/db run migrate:deploy
          echo "::endgroup::"

          echo "::group::Build (Turbo)"
          pnpm build
          echo "::endgroup::"

          echo "::group::Restart services"
          sudo systemctl restart sparki-api sparki-web
          echo "::endgroup::"

          echo "::group::Verify services are active"
          for unit in sparki-api sparki-web; do
            if ! systemctl is-active --quiet "$unit"; then
              echo "ERROR: $unit did not become active after restart"
              systemctl status "$unit" --no-pager || true
              echo "--- last 80 log lines for $unit ---"
              journalctl -u "$unit" -n 80 --no-pager || true
              exit 1
            fi
            echo "$unit is active"
          done
          echo "::endgroup::"

          echo "::group::Health checks"
          API_PORT_VAL="$(grep -E '^API_PORT=' .env | tail -n1 | cut -d= -f2- | tr -d '"')"
          WEB_PORT_VAL="$(grep -E '^WEB_PORT=' .env | tail -n1 | cut -d= -f2- | tr -d '"')"
          API_PORT_VAL="${API_PORT_VAL:-4000}"
          WEB_PORT_VAL="${WEB_PORT_VAL:-3000}"

          check() {
            name="$1"
            url="$2"
            attempt=1
            while [ "$attempt" -le 10 ]; do
              if curl -fsS --max-time 5 "$url" >/dev/null 2>&1; then
                echo "$name healthy at $url"
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
            echo "ERROR: $name health check never succeeded at $url"
            return 1
          }

          check "API (/health/ready)" "http://127.0.0.1:${API_PORT_VAL}/health/ready"
          check "Web (/)" "http://127.0.0.1:${WEB_PORT_VAL}/"
          echo "::endgroup::"

          echo "Deployed commit: $DEPLOY_SHA"
          REMOTE

      - name: Clean up deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
